[package]
name = "public-phonebook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
phonebook-core = { path = "../phonebook-core" }
anyhow = "1"
askama = "=0.16.1"
axum = "=0.8.9"
calamine = "=0.37.0"
clap = { version = "4", features = ["derive"] }
csv = "1.4"
encoding_rs = "0.8"
fs2 = "0.4"
getrandom = "=0.4.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
unicode-normalization = "0.1"
url = "2"
utoipa = "=6.0.0"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "=1.12.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "=0.60.2", default-features = false }

[lints]
workspace = true
