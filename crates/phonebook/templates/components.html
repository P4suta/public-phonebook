{% macro phone(phone) %}
<a class="phone" href="tel:{{ phone.e164 }}">
<span class="phone-caption"><img class="icon" src="/icons/phone.svg" width="16" height="16" alt="">電話をかける</span>
<strong class="phone-number">{{ phone.original }}</strong>
</a>
{% endmacro %}
{% macro tags(c) %}
<div class="tags">
<span>{% if !c.icon.is_empty() %}<img class="icon" src="/icons/{{ c.icon }}.svg" width="16" height="16" alt="">{% endif %}{{ c.category }}</span>
<span class="prefecture-tag">{{ c.prefecture }}</span>
{% if !c.municipality.is_empty() %}<span>{{ c.municipality }}</span>{% endif %}
</div>
{% endmacro %}
