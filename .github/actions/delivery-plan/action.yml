name: Validate delivery inputs
description: Rebuild the requested plan from the exact protected main candidate before credentials are available.

inputs:
  operation:
    description: Independently requested operation
    required: true
  source:
    description: Immutable candidate commit
    required: true
  controller:
    description: Immutable controller commit
    required: true
  plan:
    description: SHA-256 of the requested plan
    required: true
  request:
    description: Saved request identity
    required: true
  base:
    description: Explicit comparison commit, never an inferred deployed baseline
    default: ""
  targets:
    description: Explicit targets, or empty for affected target suggestions
    default: ""
  dataset:
    description: Immutable ready manifest digest
    default: ""

outputs:
  worker:
    description: The candidate requires Worker verification
    value: ${{ steps.plan.outputs.worker }}
  ios:
    description: The candidate requires iOS verification
    value: ${{ steps.plan.outputs.ios }}
  android:
    description: The candidate requires Android verification
    value: ${{ steps.plan.outputs.android }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SOURCE: ${{ inputs.source }}
        CONTROLLER: ${{ inputs.controller }}
        PLAN: ${{ inputs.plan }}
        REQUEST: ${{ inputs.request }}
        BASE: ${{ inputs.base }}
        TARGETS: ${{ inputs.targets }}
        DATASET: ${{ inputs.dataset }}
      run: >-
        mise x -- just delivery controller --operation "$OPERATION" --source "$SOURCE"
        --controller "$CONTROLLER" --plan "$PLAN" --request "$REQUEST" --base "$BASE"
        --targets "$TARGETS" --dataset "$DATASET" --output "$GITHUB_OUTPUT"
