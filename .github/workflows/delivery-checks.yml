name: Delivery checks

on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      source:
        type: string
        required: true
      controller:
        type: string
        required: true
      plan:
        type: string
        required: true
      request:
        type: string
        required: true
      base:
        type: string
        default: ""
      targets:
        type: string
        default: ""
      dataset:
        type: string
        default: ""

permissions: {}

jobs:
  plan:
    name: Validate candidate identity and dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      worker: ${{ steps.plan.outputs.worker }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust just
          dependencies: "false"
      - id: plan
        uses: $/.github/actions/delivery-plan
        with:
          operation: ${{ inputs.operation }}
          source: ${{ inputs.source }}
          controller: ${{ inputs.controller }}
          plan: ${{ inputs.plan }}
          request: ${{ inputs.request }}
          base: ${{ inputs.base }}
          targets: ${{ inputs.targets }}
          dataset: ${{ inputs.dataset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-plan
          path: target/delivery/plan.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  fast:
    name: Fast candidate checks
    needs: [plan]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just check
      - run: mise x -- just check-rust
  proofs:
    name: Delivery and affected platform proofs
    needs: [plan]
    if: inputs.operation != 'version-ios' && inputs.operation != 'version-android'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust just
          dependencies: "false"
      - run: mise x -- just delivery-prove
      - if: needs.plan.outputs.ios == 'true' && inputs.operation != 'ios-testflight'
        run: mise x -- just ios-prove
      - if: needs.plan.outputs.android == 'true'
        run: mise x -- just android-prove
      - if: needs.plan.outputs.android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-proof
          path: target/android/proof/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-proof
          path: target/delivery/proof/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: delivery-proof-failure
          path: target/delivery/proof
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  worker:
    name: Affected Worker contracts
    needs: [plan, fast]
    if: needs.plan.outputs.worker == 'true' && inputs.operation != 'worker' && inputs.operation != 'version-ios' && inputs.operation != 'version-android'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- npm exec --no -- playwright install --with-deps chromium
      - run: mise x -- just check-build
      - run: mise x -- just prove
  ios:
    name: Affected installed iOS client
    needs: [plan, fast]
    if: needs.plan.outputs.ios == 'true' && inputs.operation != 'ios-testflight' && inputs.operation != 'worker' && inputs.operation != 'version-ios' && inputs.operation != 'version-android'
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-simulator-runtimes
      - id: inputs
        run: mise x -- just delivery platform-key ios --output "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/delivery/platforms/ios.json
            target/delivery/platforms/ios-check.json
            target/ios/receipt.json
            target/ios/sanitizer-receipt.json
            target/ios/mutation-receipt.json
          key: ios-assurance-${{ steps.inputs.outputs.key }}
      - run: mise x -- just delivery platform ios
  android:
    name: Affected installed Android client
    needs: [plan, fast]
    if: needs.plan.outputs.android == 'true' && inputs.operation != 'android-artifacts' && inputs.operation != 'version-ios' && inputs.operation != 'version-android'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - uses: $/.github/actions/android-sdk
      - id: inputs
        run: mise x -- just delivery platform-key android --output "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/delivery/platforms/android.json
            target/delivery/platforms/android-check.json
            target/android/gradle-check.txt
            target/android/mutation/receipt.json
          key: android-assurance-${{ steps.inputs.outputs.key }}
      - run: mise x -- just delivery platform android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() || cancelled()
        with:
          name: android-verification-failure
          path: |
            target/android/gradle-check.txt
            target/android/mutation/run-*/*.txt
            target/android/mutation/run-*/*.xml
          if-no-files-found: ignore
          retention-days: 7
  gate:
    name: Required delivery checks
    needs: [plan, fast, proofs, worker, ios, android]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust just
          dependencies: "false"
      - name: Refuse failed, cancelled, or unexpectedly skipped checks
        env:
          OPERATION: ${{ inputs.operation }}
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.fast.result }}
          PROOFS: ${{ needs.proofs.result }}
          WORKER: ${{ needs.worker.result }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
          WORKER_REQUIRED: ${{ needs.plan.outputs.worker }}
          IOS_REQUIRED: ${{ needs.plan.outputs.ios }}
          ANDROID_REQUIRED: ${{ needs.plan.outputs.android }}
        run: >-
          mise x -- just delivery gate --operation "$OPERATION" --plan "$PLAN" --fast "$FAST"
          --proofs "$PROOFS" --worker "$WORKER" --ios "$IOS" --android "$ANDROID"
          --worker-required "$WORKER_REQUIRED" --ios-required "$IOS_REQUIRED" --android-required "$ANDROID_REQUIRED"
