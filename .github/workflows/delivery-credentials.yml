name: Read-only credential transport

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verify one scoped configuration without signing or publication
        type: choice
        options: [version-preparation, testflight-signing, testflight-upload, operations-preview, operations-apply]
        required: true

permissions: {}

concurrency:
  group: delivery-credentials-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  context:
    name: Validate the selected transport
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require protected main and one known configuration
        env:
          TARGET: ${{ inputs.target }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          case "$TARGET" in
            version-preparation|testflight-signing|testflight-upload|operations-preview|operations-apply) ;;
            *) exit 1 ;;
          esac
  version:
    name: Version proposal credential transport
    needs: [context]
    if: inputs.target == 'version-preparation'
    runs-on: ubuntu-26.04
    environment: version-preparation
    timeout-minutes: 5
    permissions:
      id-token: write # Reads only the App key through its preparation identity.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_version_preparation
          inject-env-vars: "false"
      - name: Check delivery without displaying credential values
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY: ${{ steps.doppler.outputs.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID"
          test -n "$PRIVATE_KEY"
  signing:
    name: Apple signing credential transport
    needs: [context]
    if: inputs.target == 'testflight-signing'
    runs-on: ubuntu-26.04
    environment: testflight-signing
    timeout-minutes: 5
    concurrency:
      group: testflight-delivery
      cancel-in-progress: false
    permissions:
      id-token: write # Reads signing material without importing a key or signing an artifact.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_testflight_signing
          inject-env-vars: "false"
      - name: Check delivery without displaying credential values
        env:
          CERTIFICATE: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ steps.doppler.outputs.APP_PROVISIONING_PROFILE_BASE64 }}
          EXTENSION_PROFILE: ${{ steps.doppler.outputs.CALL_DIRECTORY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE"
          test -n "$PASSWORD"
          test -n "$APP_PROFILE"
          test -n "$EXTENSION_PROFILE"
  upload:
    name: App Store Connect credential transport
    needs: [context]
    if: inputs.target == 'testflight-upload'
    runs-on: ubuntu-26.04
    environment: testflight-upload
    timeout-minutes: 5
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    permissions:
      id-token: write # Reads the upload key without generating a token or contacting App Store Connect.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_testflight_upload
          inject-env-vars: "false"
      - name: Check delivery without displaying credential values
        env:
          KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ steps.doppler.outputs.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$KEY_ID"
          test -n "$ISSUER_ID"
          test -n "$PRIVATE_KEY"
  preview:
    name: Configuration preview credential transport
    needs: [context]
    if: inputs.target == 'operations-preview'
    runs-on: ubuntu-26.04
    environment: operations-preview
    timeout-minutes: 5
    permissions:
      id-token: write # Reads only the configuration preview identity's values.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_operations_preview
          inject-env-vars: "false"
      - name: Check delivery without displaying credential values
        env:
          ACCOUNT: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ steps.doppler.outputs.CLOUDFLARE_ALERT_EMAIL }}
          MONITORS_TOKEN: ${{ steps.doppler.outputs.BETTER_STACK_API_TOKEN }}
          TEAM: ${{ steps.doppler.outputs.BETTER_STACK_TEAM }}
        run: |
          test -n "$ACCOUNT"
          test -n "$CLOUDFLARE_TOKEN"
          test -n "$EMAIL"
          test -n "$MONITORS_TOKEN"
          test -n "$TEAM"
  apply:
    name: Configuration apply credential transport
    needs: [context]
    if: inputs.target == 'operations-apply'
    runs-on: ubuntu-26.04
    environment: operations-apply
    timeout-minutes: 5
    concurrency:
      group: configuration-production
      cancel-in-progress: false
    permissions:
      id-token: write # Reads the write identity's values without issuing provider requests.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_operations_apply
          inject-env-vars: "false"
      - name: Check delivery without displaying credential values
        env:
          ACCOUNT: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ steps.doppler.outputs.CLOUDFLARE_ALERT_EMAIL }}
          MONITORS_TOKEN: ${{ steps.doppler.outputs.BETTER_STACK_API_TOKEN }}
          TEAM: ${{ steps.doppler.outputs.BETTER_STACK_TEAM }}
        run: |
          test -n "$ACCOUNT"
          test -n "$CLOUDFLARE_TOKEN"
          test -n "$EMAIL"
          test -n "$MONITORS_TOKEN"
          test -n "$TEAM"
