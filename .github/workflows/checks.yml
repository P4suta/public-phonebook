name: Checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      assurance:
        description: Run the complete native and formal assurance candidate checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.10.19"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.npm
            ~/.cargo/registry
            ~/.cargo/git
            tools/ios-check/target
          key: checks-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tools/ios-check/Cargo.lock', 'mise.toml') }}
      - run: mise x -- npm ci --ignore-scripts
      - run: mise x -- npm exec --no -- playwright install --with-deps chromium
      - run: mise x -- just check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: verification-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  proofs:
    name: Formal assurance
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.10.19"
      - run: mise x -- npm ci --ignore-scripts
      - run: mise x -- just prove
      - run: mise x -- just ios-prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: proof-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
  ios:
    name: Native assurance
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.assurance
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: "2026.10.19"
      - run: mise x -- npm ci --ignore-scripts
      - run: mise x -- just ios-check
      - run: mise x -- just ios-sanitize
      - run: mise x -- just ios-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-failure-evidence
          path: target/ios
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Checks
    if: always()
    needs: [verify, proofs, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PROOFS_RESULT: ${{ needs.proofs.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          ASSURANCE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.assurance }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$ASSURANCE_REQUIRED:$PROOFS_RESULT" = true:success || test "$ASSURANCE_REQUIRED:$PROOFS_RESULT" = false:skipped
          test "$ASSURANCE_REQUIRED:$IOS_RESULT" = true:success || test "$ASSURANCE_REQUIRED:$IOS_RESULT" = false:skipped
