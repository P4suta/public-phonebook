name: Checks

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: scope
        name: Detect Rust inputs
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${CHANGE_BASE}"
          changed="$(git diff --name-only "${CHANGE_BASE}" HEAD -- android tools/android-check tools/ios-check tools/delivery tools/check-rust.ts mise.toml ':(glob)**/rust-toolchain*' .github/actions/toolchain .github/workflows/checks.yml)"
          echo "Changed Rust inputs: ${changed:-none}"
          if [[ -n ${changed} ]]; then rust=true; else rust=false; fi
          echo "rust=${rust}" >>"${GITHUB_OUTPUT}"
          android="$(git diff --name-only "${CHANGE_BASE}" HEAD -- android tools/android-check tools/delivery/core verification/android ios/Tests/PhonebookCoreTests/SearchContract.json ios/Tests/PhonebookKitTests/DirectoryContract.json src/core/kanji-variants.ts mise.toml .github/actions/android-sdk .github/workflows/checks.yml)"
          if [[ -n ${android} ]]; then android=true; else android=false; fi
          echo "android=${android}" >>"${GITHUB_OUTPUT}"
          if [[ ${android} == true ]]; then echo 'rust=true' >>"${GITHUB_OUTPUT}"; fi
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # `mise x` would otherwise install every pinned tool, including Rust.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just biome actionlint zizmor gitleaks
      - run: mise x -- just check
  build:
    name: Build budget
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
      - name: Build the client and Worker
        run: mise x -- npm run build
      - name: Check the build against its size budget
        run: mise x -- node tools/build-budget.ts
  rust:
    name: Native checks
    needs: [scope]
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust just node java gradle github:rustsec/rustsec
      - run: mise x -- just check-rust
      - if: needs.scope.outputs.android == 'true'
        uses: $/.github/actions/android-sdk
      - if: needs.scope.outputs.android == 'true'
        run: mise x -- just android-check
  gate:
    name: Checks
    if: always()
    needs: [scope, verify, build, rust]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$RUST_REQUIRED:$RUST_RESULT" = true:success || test "$RUST_REQUIRED:$RUST_RESULT" = false:skipped
