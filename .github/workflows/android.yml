name: Android candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-candidate
  cancel-in-progress: false

jobs:
  fast:
    name: Repository checks
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just biome actionlint zizmor gitleaks github:rustsec/rustsec
      - run: mise x -- just check
      - run: mise x -- just check-rust
  proofs:
    name: Formal assurance
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust just
          dependencies: "false"
      - run: mise x -- just delivery-prove
      - run: mise x -- just android-prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-proof
          path: target/delivery/proof
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-proof
          path: target/android/proof
          if-no-files-found: error
          retention-days: 7
  native:
    name: Android assurance
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just java
      - uses: $/.github/actions/android-sdk
      - run: mise x -- just android-check
      - run: mise x -- just android-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-mutation
          path: target/android/mutation/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  candidate:
    name: Preserve unsigned production artifacts
    needs: [fast, proofs, native]
    runs-on: ubuntu-26.04
    environment: candidate
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Attests the unsigned candidate without fetching an upload key.
      attestations: write # Records provenance for the candidate artifacts.
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just java
      - uses: $/.github/actions/android-sdk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: delivery-proof
          path: target/delivery/proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-proof
          path: target/android/proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-mutation
          path: target/android/mutation
      - if: github.run_attempt == 1
        name: Allocate and prepare one candidate
        run: |
          number=$(mise x -- just delivery build-number "$GITHUB_RUN_NUMBER")
          mise x -- just android-prepare "$number"
      - if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-unsigned-candidate
          path: target/android/candidate
      - if: github.run_attempt == 1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/android/candidate/*
      - if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-unsigned-candidate
          path: target/android/candidate
          if-no-files-found: error
          retention-days: 7
