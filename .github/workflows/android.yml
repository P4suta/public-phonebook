name: Android candidate
run-name: Delivery ${{ inputs.operation }} ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare unsigned Android artifacts
        type: choice
        options: [android-artifacts]
        default: android-artifacts
      source:
        description: Exact protected main candidate commit
        type: string
        required: true
      controller:
        description: Exact protected main controller commit
        type: string
        required: true
      plan:
        description: Saved delivery plan digest
        type: string
        required: true
      request:
        description: Saved delivery request identity
        type: string
        required: true
      base:
        description: Explicit comparison commit
        type: string
        default: ""
      targets:
        description: Explicit target selection, or empty for suggestions
        type: string
        default: ""
      dataset:
        description: Optional immutable Worker dataset dependency
        type: string
        default: ""

permissions: {}

concurrency:
  group: android-candidate
  cancel-in-progress: false

jobs:
  delivery-checks:
    name: Dependency checks
    permissions:
      contents: read
    uses: ./.github/workflows/delivery-checks.yml # zizmor: ignore[self-repository] actionlint 1.7.12 can't read a `$/` reusable workflow call.
    with:
      operation: ${{ inputs.operation }}
      source: ${{ inputs.source }}
      controller: ${{ inputs.controller }}
      plan: ${{ inputs.plan }}
      request: ${{ inputs.request }}
      base: ${{ inputs.base }}
      targets: ${{ inputs.targets }}
      dataset: ${{ inputs.dataset }}
  native:
    name: Android assurance
    needs: [delivery-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: mise x -- just android-check
      - run: mise x -- just android-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-mutation
          path: target/android/mutation/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  candidate:
    name: Preserve unsigned production artifacts
    needs: [delivery-checks, native]
    runs-on: ubuntu-24.04
    environment: candidate
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Attests the unsigned candidate without fetching an upload key.
      attestations: write # Records provenance for the candidate artifacts.
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: delivery-proof
          path: target/delivery/proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-proof
          path: target/android/proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-mutation
          path: target/android/mutation
      - if: github.run_attempt == 1
        name: Allocate and prepare one candidate
        run: |
          number=$(mise x -- just delivery build-number "$GITHUB_RUN_NUMBER")
          mise x -- just android-prepare "$number"
      - if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-unsigned-candidate
          path: target/android/candidate
      - if: github.run_attempt == 1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/android/candidate/*
      - if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-unsigned-candidate
          path: target/android/candidate
          if-no-files-found: error
          retention-days: 7
