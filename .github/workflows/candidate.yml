name: Web release checks

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: web-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Repository and browser contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just biome actionlint zizmor gitleaks github:rustsec/rustsec
      - run: mise x -- npm exec --no -- playwright install --with-deps chromium
      - run: mise x -- just check
      - run: mise x -- just check-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: web-contract-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  prove:
    name: Directory proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just
      - run: mise x -- just prove
  browser:
    name: Production dataset and four browsers
    runs-on: ubuntu-26.04
    environment: observe
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Fetches the pinned dataset with read-only credentials.
    env:
      CF_SEND_TELEMETRY: "false"
      DIAL_LOCAL_BUNDLE: target/web-dataset
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - run: npm ci --ignore-scripts
      - run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Fetch and verify the pinned dataset
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node infrastructure/cloudflare/src/remote-data.ts --fetch-production target/web-dataset
      - run: just data-check target/web-dataset
      - run: just phone-quality target/web-dataset target/phone-quality.json
      - run: npm run build
      - run: just data-local target/web-dataset
      - run: node tools/search-parity.ts target/web-dataset
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-dataset
          path: target/web-dataset
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: web-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
