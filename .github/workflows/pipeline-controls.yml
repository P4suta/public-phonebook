name: Pipeline controls

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: SHA-256 of a dataset with candidate evidence for this tree, used by the withdrawal drill
        type: string
        required: true

permissions: {}

concurrency:
  group: pipeline-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fakes:
    name: Refusals with fake providers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
      - name: Refuse unverified, displaced, removed, and different candidates, foreign leases, and stale evidence
        run: npm exec --no -- vitest run tests/unit/release-lifecycle.test.ts tests/unit/withdrawal-drill.test.ts tests/unit/public-request.test.ts tests/unit/worker-settings.test.ts tests/unit/control-lease.test.ts tests/unit/release-store.test.ts tests/unit/release-inputs.test.ts tests/unit/workflow-policy.test.ts
      - name: Refuse a release workflow job that skips the main branch guard
        run: node tools/workflow-policy.ts
  foreign-secret:
    name: Refuse another environment's secrets
    runs-on: ubuntu-24.04
    environment: observe
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Requests the Doppler ci_production config from the observe identity, which must be refused.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: foreign
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        continue-on-error: true
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_production
          inject-env-vars: "false"
      - name: Require the refusal
        env:
          OUTCOME: ${{ steps.foreign.outcome }}
        run: test "$OUTCOME" = failure
  read-only-deploy:
    name: Refuse a deployment with the read-only token
    runs-on: ubuntu-24.04
    environment: observe
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_observe config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Require an authorization refusal for a deployment of a version that doesn't exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if output=$(npm exec --no -- cf workers deployments create --worker dial-production --strategy percentage --versions '[{"version_id":"00000000-0000-4000-8000-000000000000","percentage":100}]' 2>&1); then
            echo "::error::The read-only token created a deployment"
            exit 1
          fi
          printf '%s\n' "$output" | grep -E -q 'Authentication error|10000|403'
  drill-evidence:
    name: Admit the drill candidate's evidence
    runs-on: ubuntu-24.04
    environment: observe
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_observe config.
    outputs:
      database: ${{ steps.evidence.outputs.database-sha256 }}
      manifest: ${{ steps.evidence.outputs.manifest-sha256 }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - id: evidence
        name: Require passing evidence for every candidate stage
        env:
          DATASET: ${{ inputs.dataset }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --check-evidence --dataset "$DATASET"
  drill-build:
    name: Build and attest the drill candidate
    needs: [drill-evidence]
    runs-on: ubuntu-24.04
    environment: candidate
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Signs the build provenance; this job fetches no secret.
      attestations: write # Stores the build provenance for the drill job to verify.
    outputs:
      artifact: ${{ steps.digest.outputs.artifact-sha256 }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Build the production Worker without secrets
        env:
          DIAL_DATABASE_SHA256: ${{ needs.drill-evidence.outputs.database }}
          DIAL_MANIFEST_SHA256: ${{ needs.drill-evidence.outputs.manifest }}
        run: npm run build -- production
      - id: digest
        name: Record the build digest
        run: node tools/publish.ts production --build-digest
      - name: Package the build output
        run: |
          mkdir -p target/release
          tar --create --file target/release/worker-build.tar --directory .cloudflare output
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/release/worker-build.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drill-worker-build
          path: target/release/worker-build.tar
          if-no-files-found: error
          retention-days: 7
  drill:
    name: Withdraw a 0% candidate after an injected probe failure
    needs: [drill-evidence, drill-build]
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 150
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_release_candidate config.
      attestations: read # Reads the build provenance before the upload.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Install the browsers for the candidate checks
        run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: drill-worker-build
          path: target/release
      - name: Require the build provenance from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify target/release/worker-build.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pipeline-controls.yml" --source-ref refs/heads/main
      - name: Unpack the attested build
        run: |
          mkdir -p .cloudflare
          tar --extract --file target/release/worker-build.tar --directory .cloudflare
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_release_candidate
          inject-env-vars: "false"
      - name: Fetch the dataset and check every file
        env:
          DATASET: ${{ needs.drill-evidence.outputs.manifest }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/remote-data.ts --fetch "$DATASET" ".local/datasets/$DATASET"
      - name: Prepare the dataset's D1 database and archives
        env:
          DATASET: ${{ needs.drill-evidence.outputs.manifest }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/remote-data.ts production ".local/datasets/$DATASET"
      - name: Stage, check, inject a probe failure, and require the withdrawal
        env:
          DATASET: ${{ needs.drill-evidence.outputs.manifest }}
          ARTIFACT: ${{ needs.drill-build.outputs.artifact }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --drill --dataset "$DATASET" --artifact "$ARTIFACT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: drill-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
