name: Version proposals

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare one app's version proposal without publication
        type: choice
        options: [version-ios, version-android]
        required: true

permissions: {}

concurrency:
  group: version-proposal-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate version preparation
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just biome actionlint zizmor gitleaks github:rustsec/rustsec
      - run: mise x -- just check
      - run: mise x -- just check-rust
  proposal:
    name: Create or update a version proposal
    needs: [verify]
    runs-on: ubuntu-26.04
    environment: version-preparation
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Fetches only the version proposal App's private key.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: rust node just
      - name: Compile the controller before fetching credentials
        run: mise x -- cargo build --locked --manifest-path tools/delivery/Cargo.toml
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_version_preparation
          inject-env-vars: "false"
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ steps.doppler.outputs.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: P4suta
          repositories: public-phonebook
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Prepare the selected app's proposal
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          app=${OPERATION#version-}
          tools/delivery/target/debug/delivery version-proposal "$app"
          node tools/version-proposals.ts target/delivery/version-request.json
