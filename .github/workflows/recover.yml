name: Recover

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Withdraw a candidate that never took traffic, or restore the verified predecessor
        type: choice
        options:
          - withdraw
          - restore
        required: true

permissions: {}

concurrency:
  group: recover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  withdraw:
    name: Withdraw the candidate
    if: inputs.operation == 'withdraw'
    runs-on: ubuntu-26.04
    environment: release-candidate
    timeout-minutes: 20
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_release_candidate config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_release_candidate
          inject-env-vars: "false"
      - name: Remove the candidate and keep the serving version
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --withdraw
  inspect:
    name: Show what a restore would change
    if: inputs.operation == 'restore'
    runs-on: ubuntu-26.04
    environment: observe
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_observe config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Report the journal and the deployed versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --status
  restore:
    name: Restore the verified predecessor
    needs: [inspect]
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 90
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_production config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Install the browsers for the public checks
        run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_production
          inject-env-vars: "false"
      - name: Restore and check the verified predecessor
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --recover
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: restore-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
