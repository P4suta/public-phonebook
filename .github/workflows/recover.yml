name: Restore website version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Worker version UUID from the Cloudflare deployment history
        type: string
        required: true

permissions: {}

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: web-rollback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect the requested version
    runs-on: ubuntu-26.04
    environment: observe
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Reads Cloudflare version history before production approval.
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Read the provider's version details
        env:
          VERSION: ${{ inputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --no -- cf workers versions get "$VERSION" --worker-id dial-production
  restore:
    name: Restore the approved version
    needs: [inspect]
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://www.dial.page
    timeout-minutes: 15
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Fetches the production token after version inspection and approval.
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node
          dependencies: "false"
      - run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_production
          inject-env-vars: "false"
      - name: Deploy the existing version without rebuilding
        env:
          VERSION: ${{ inputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          printf -v versions '[{"version_id":"%s","percentage":100}]' "$VERSION"
          npm exec --no -- cf workers deployments create --worker dial-production --strategy percentage --versions "$versions"
      - name: Check the public catalog
        run: curl --fail --silent --show-error --retry 3 --max-time 30 https://www.dial.page/api/catalog --output /dev/null
