name: Assurance

on:
  workflow_dispatch:
    inputs:
      campaigns:
        description: Also run the iOS sanitizer and mutation campaigns
        type: boolean
        default: false
  workflow_call:
    inputs:
      campaigns:
        description: Also run the iOS sanitizer and mutation campaigns
        type: boolean
        default: false

permissions: {}

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- npm exec --no -- playwright install --with-deps chromium
      - run: mise x -- just check-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: build-check-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  proofs:
    name: Formal assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just prove
      - run: mise x -- just ios-prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: proof-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
  native:
    name: Native assurance
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-check
      - if: inputs.campaigns
        run: mise x -- just ios-sanitize
      - if: inputs.campaigns
        run: mise x -- just ios-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() || cancelled()
        with:
          name: native-failure-evidence
          path: target/ios
          if-no-files-found: error
          retention-days: 7
