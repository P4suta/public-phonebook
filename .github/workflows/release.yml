name: Deploy website

on:
  workflow_dispatch:

permissions: {}

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Web release checks
    permissions:
      contents: read
      id-token: write # Lets the dataset job use the read-only observe identity.
    uses: ./.github/workflows/candidate.yml # zizmor: ignore[self-repository] actionlint 1.7.12 cannot parse a `$/` reusable workflow reference.
  build:
    name: Build the production Worker
    needs: [verify]
    runs-on: ubuntu-26.04
    environment: candidate
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Signs provenance without fetching deployment credentials.
      attestations: write # Records the preserved build's provenance.
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
      - name: Build without credentials
        run: npm exec --no --workspace @public-phonebook/web -- cf build
      - name: Validate the production build without API requests
        run: npm exec --no --workspace @public-phonebook/web -- cf deploy --prebuilt --mode production --dry-run
      - run: node tools/build-budget.ts
      - name: Preserve the build and generate the npm SBOM
        run: |
          mkdir -p target/web
          tar --create --gzip --file target/web/worker-build.tar.gz --directory apps/web/.cloudflare/output/v0 .
          npm sbom --sbom-format cyclonedx --omit=dev --workspace @public-phonebook/web > target/web/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/web/worker-build.tar.gz
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: target/web/worker-build.tar.gz
          sbom-path: target/web/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-build
          path: target/web
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: Deploy the approved build
    needs: [build]
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://www.dial.page
    timeout-minutes: 60
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read # Verifies the original build before credentials are fetched.
      id-token: write # Fetches the environment-bound deployment token.
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-build
          path: target/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-dataset
          path: target/web-dataset
      - name: Verify and unpack the preserved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify target/web/worker-build.tar.gz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          mkdir -p apps/web/.cloudflare/output/v0
          tar --extract --gzip --file target/web/worker-build.tar.gz --directory apps/web/.cloudflare/output/v0
      - run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_production
          inject-env-vars: "false"
      - name: Deploy the preserved output with the official CLI
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --no --workspace @public-phonebook/web -- cf deploy --prebuilt --mode production --provision=false --tag "$GITHUB_SHA"
      - name: Check the public site and dataset
        env:
          DIAL_PUBLIC_ORIGIN: https://www.dial.page
          DIAL_PUBLIC_BUNDLE: target/web-dataset
        run: npm exec --no -- playwright test --config apps/web/tests/public/playwright.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: web-deployment-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
