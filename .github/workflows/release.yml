name: Release

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: SHA-256 of the dataset's ready manifest
        type: string
        required: true
      checks:
        description: Run the candidate checks, or reuse evidence that already exists for this tree and dataset
        type: choice
        options:
          - run
          - reuse
        default: run

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate checks
    if: inputs.checks == 'run'
    permissions:
      contents: read
      id-token: write # Lets the called evidence job exchange its OIDC token for the Doppler ci_candidate config.
    uses: ./.github/workflows/candidate.yml # zizmor: ignore[self-repository] actionlint 1.7.12 can't read a `$/` reusable workflow call.
    with:
      dataset: ${{ inputs.dataset }}
  evidence:
    name: Admit the candidate evidence
    needs: [candidate]
    if: always() && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: observe
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_observe config.
    outputs:
      database: ${{ steps.evidence.outputs.database-sha256 }}
      manifest: ${{ steps.evidence.outputs.manifest-sha256 }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - id: evidence
        name: Require passing evidence for every candidate stage
        env:
          DATASET: ${{ inputs.dataset }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --check-evidence --dataset "$DATASET"
  build:
    name: Build and attest the Worker
    needs: [evidence]
    runs-on: ubuntu-24.04
    environment: candidate
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Signs the build provenance; this job fetches no secret.
      attestations: write # Stores the build provenance for the stage job to verify.
    outputs:
      artifact: ${{ steps.digest.outputs.artifact-sha256 }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Build the production Worker without secrets
        env:
          DIAL_DATABASE_SHA256: ${{ needs.evidence.outputs.database }}
          DIAL_MANIFEST_SHA256: ${{ needs.evidence.outputs.manifest }}
        run: npm run build -- production
      - id: digest
        name: Record the build digest
        run: node tools/publish.ts production --build-digest
      - name: Package the build output
        run: |
          mkdir -p target/release
          tar --create --file target/release/worker-build.tar --directory .cloudflare output
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/release/worker-build.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: worker-build
          path: target/release/worker-build.tar
          if-no-files-found: error
          retention-days: 30
  stage:
    name: Prepare the data and deploy the candidate at 0%
    needs: [evidence, build]
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 120
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_release_candidate config.
      attestations: read # Reads the build provenance before the upload.
    outputs:
      release: ${{ steps.stage.outputs.release-id }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: worker-build
          path: target/release
      - name: Require the build provenance from this release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify target/release/worker-build.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref refs/heads/main
      - name: Unpack the attested build
        run: |
          mkdir -p .cloudflare
          tar --extract --file target/release/worker-build.tar --directory .cloudflare
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_release_candidate
          inject-env-vars: "false"
      - name: Fetch the dataset and check every file
        env:
          DATASET: ${{ needs.evidence.outputs.manifest }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/remote-data.ts --fetch "$DATASET" ".local/datasets/$DATASET"
      - name: Prepare the dataset's D1 database and archives
        env:
          DATASET: ${{ needs.evidence.outputs.manifest }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/remote-data.ts production ".local/datasets/$DATASET"
      - id: stage
        name: Upload the attested build and deploy it at 0%
        env:
          DATASET: ${{ needs.evidence.outputs.manifest }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --stage --dataset "$DATASET" --artifact "$ARTIFACT"
  verify:
    name: Check the candidate through the version override
    needs: [stage]
    runs-on: ubuntu-24.04
    environment: observe
    timeout-minutes: 90
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the read-only Doppler ci_observe config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Install the browsers for the public checks
        run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Check the candidate at 0%
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --verify-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: candidate-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  withdraw:
    name: Withdraw the failed candidate
    needs: [stage, verify]
    if: always() && needs.stage.result == 'success' && (needs.verify.result == 'failure' || needs.verify.result == 'cancelled')
    runs-on: ubuntu-24.04
    environment: release-candidate
    timeout-minutes: 20
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_release_candidate config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_release_candidate
          inject-env-vars: "false"
      - name: Remove the candidate and keep the serving version
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --withdraw
  promote:
    name: Move traffic to the approved candidate
    needs: [stage, verify]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_production config.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
          dependencies: "false"
      - name: Install the locked npm packages without the shared cache
        run: npm ci --ignore-scripts
      - name: Install the browsers for the public checks
        run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_production
          inject-env-vars: "false"
      - name: Switch from 0% to 100% and check without the override
        env:
          RELEASE: ${{ needs.stage.outputs.release }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node tools/publish.ts production --promote --release "$RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: promotion-failure-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
