name: Website deployment history

on:
  workflow_dispatch:

permissions: {}

env:
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: web-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: Read Cloudflare deployment history
    runs-on: ubuntu-26.04
    environment: observe
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Reads the provider's deployment history with the observe identity.
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_observe
          inject-env-vars: "false"
      - name: Read deployed versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --no -- cf workers deployments list --worker dial-production
