name: TestFlight
run-name: Delivery ${{ inputs.operation }} ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: TestFlight upload and processing operation
        type: choice
        options: [ios-testflight]
        default: ios-testflight
      source:
        description: Exact protected main candidate commit
        type: string
        required: true
      controller:
        description: Exact protected main controller commit
        type: string
        required: true
      plan:
        description: Saved delivery plan digest
        type: string
        required: true
      request:
        description: Saved delivery request identity
        type: string
        required: true
      base:
        description: Explicit comparison commit
        type: string
        default: ""
      targets:
        description: Explicit target selection, or empty for suggestions
        type: string
        default: ""
      dataset:
        description: Optional immutable Worker dataset dependency
        type: string
        default: ""

permissions: {}

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delivery-checks:
    name: Dependency checks
    permissions:
      contents: read
    uses: ./.github/workflows/delivery-checks.yml # zizmor: ignore[self-repository] actionlint 1.7.12 can't read a `$/` reusable workflow call.
    with:
      operation: ${{ inputs.operation }}
      source: ${{ inputs.source }}
      controller: ${{ inputs.controller }}
      plan: ${{ inputs.plan }}
      request: ${{ inputs.request }}
      base: ${{ inputs.base }}
      targets: ${{ inputs.targets }}
      dataset: ${{ inputs.dataset }}
  proofs:
    name: Formal assurance
    needs: [delivery-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-receipt
          path: target/ios/proof-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: proof-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  native:
    name: Native assurance
    needs: [delivery-checks]
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-check
      - run: mise x -- just ios-sanitize
      - run: mise x -- just ios-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-receipts
          path: |
            target/ios/receipt.json
            target/ios/sanitizer-receipt.json
            target/ios/mutation-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  unsigned:
    name: Build the unsigned candidate without credentials
    needs: [delivery-checks, proofs, native]
    runs-on: xcode-27
    environment: candidate
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write # Attests the unsigned archive without fetching signing credentials.
      attestations: write # Records provenance for the unsigned archive.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: proof-receipt
          path: target/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-receipts
          path: target/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: delivery-proof
          path: target/delivery/proof
      - id: build
        run: mise x -- just ios-build-number "$GITHUB_RUN_NUMBER" 1 "$GITHUB_OUTPUT"
      - if: github.run_attempt == 1
        name: Compile and package the unsigned archive
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          mise x -- just ios-prepare-archive "$BUILD_NUMBER"
          tar --create --file target/ios/unsigned-store.tar --directory target/ios unsigned-store bundled-dataset/national/directory.json receipt.json sanitizer-receipt.json mutation-receipt.json proof-receipt.json
      - if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-unsigned-candidate
          path: target/ios
      - if: github.run_attempt == 1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/ios/unsigned-store.tar
      - if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-unsigned-candidate
          path: target/ios/unsigned-store.tar
          if-no-files-found: error
          retention-days: 7
  signing:
    name: Sign the preserved archive in a fresh job
    needs: [unsigned]
    runs-on: xcode-27
    environment: testflight-signing
    timeout-minutes: 100
    concurrency:
      group: testflight-delivery
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Fetches only the protected signing identity and attests the signed package.
      attestations: write # Records provenance for the preserved signed package.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          dependencies: "false"
      - name: Compile the controller before fetching credentials
        run: mise x -- cargo build --locked --manifest-path tools/ios-check/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-unsigned-candidate
          path: target/ios
      - name: Verify the original unsigned archive and unpack it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify target/ios/unsigned-store.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
          tar --extract --file target/ios/unsigned-store.tar --directory target/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: delivery-proof
          path: target/delivery/proof
      - if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-signed-candidate
          path: target/ios
      - id: build
        run: mise x -- just ios-build-number "$GITHUB_RUN_NUMBER" 1 "$GITHUB_OUTPUT"
      - id: doppler
        if: github.run_attempt == 1
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_testflight_signing
          inject-env-vars: "false"
      - name: Archive with manual signing and verify the export
        if: github.run_attempt == 1
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          PHONEBOOK_SIGNING_KEYCHAIN: ${{ runner.temp }}/testflight-signing.keychain-db
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ steps.doppler.outputs.APP_PROVISIONING_PROFILE_BASE64 }}
          CALL_DIRECTORY_PROVISIONING_PROFILE_BASE64: ${{ steps.doppler.outputs.CALL_DIRECTORY_PROVISIONING_PROFILE_BASE64 }}
        run: tools/ios-check/target/debug/ios-check archive --prepared --require-receipts --build-number "$BUILD_NUMBER" --signing ci
      - if: github.run_attempt == 1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: target/ios/store-delivery/PublicPhonebook.ipa
      - if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-signed-candidate
          path: |
            target/ios/store-delivery
            target/ios/app-store-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete the temporary signing keychain
        if: always()
        env:
          PHONEBOOK_SIGNING_KEYCHAIN: ${{ runner.temp }}/testflight-signing.keychain-db
        run: |
          if [ -e "$PHONEBOOK_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$PHONEBOOK_SIGNING_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: delivery-failure-logs
          path: target/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  upload:
    name: Reconcile or upload the original package
    needs: [signing]
    runs-on: xcode-27
    environment: testflight-upload
    timeout-minutes: 90
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read # Verifies the signed package before the upload key is available.
      id-token: write # Fetches the App Store Connect upload key without a signing identity.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          dependencies: "false"
      - name: Compile the upload controller before fetching credentials
        run: mise x -- cargo build --locked --manifest-path tools/ios-check/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-signed-candidate
          path: target/ios
      - name: Verify the preserved signed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify target/ios/store-delivery/PublicPhonebook.ipa --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA"
      - if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-upload-state
          path: target/ios
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_testflight_upload
          inject-env-vars: "false"
      - name: Reconcile the saved upload before another write
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: tools/ios-check/target/debug/ios-check testflight
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-upload-state
          path: |
            target/ios/testflight-attempt.json
            target/ios/testflight-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
