name: TestFlight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proofs:
    name: Formal assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-prove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: proof-receipt
          path: target/ios/proof-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: proof-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  native:
    name: Native assurance
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
      - run: mise x -- just ios-check
      - run: mise x -- just ios-sanitize
      - run: mise x -- just ios-mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-receipts
          path: |
            target/ios/receipt.json
            target/ios/sanitizer-receipt.json
            target/ios/mutation-receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-failure-evidence
          path: target/ios
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  delivery:
    name: TestFlight delivery
    needs: [proofs, native]
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 100
    concurrency:
      group: testflight-delivery
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Exchanges the GitHub OIDC token for the Doppler ci_testflight config.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          dependencies: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: proof-receipt
          path: target/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-receipts
          path: target/ios
      - id: build
        run: mise x -- just ios-build-number "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_OUTPUT"
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_testflight
          inject-env-vars: "false"
      - name: Archive with manual signing and verify the export
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          PHONEBOOK_SIGNING_KEYCHAIN: ${{ runner.temp }}/testflight-signing.keychain-db
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ steps.doppler.outputs.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ steps.doppler.outputs.APP_PROVISIONING_PROFILE_BASE64 }}
          CALL_DIRECTORY_PROVISIONING_PROFILE_BASE64: ${{ steps.doppler.outputs.CALL_DIRECTORY_PROVISIONING_PROFILE_BASE64 }}
        run: mise x -- just ios-archive --require-receipts --build-number "$BUILD_NUMBER" --signing ci
      - name: Upload to TestFlight and wait for processing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.doppler.outputs.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ steps.doppler.outputs.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: mise x -- just ios-testflight
      - name: Delete the temporary signing keychain
        if: always()
        env:
          PHONEBOOK_SIGNING_KEYCHAIN: ${{ runner.temp }}/testflight-signing.keychain-db
        run: |
          if [ -e "$PHONEBOOK_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$PHONEBOOK_SIGNING_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: delivery-failure-logs
          path: target/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
