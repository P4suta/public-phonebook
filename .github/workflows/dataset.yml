name: Prepare dataset binding

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: SHA-256 of an immutable dataset manifest already stored in R2
        type: string
        required: true

permissions: {}

env:
  MISE_AUTO_INSTALL: "false"
  CF_SEND_TELEMETRY: "false"

concurrency:
  group: dataset-preparation
  cancel-in-progress: false

jobs:
  verify:
    name: Data preparation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just biome actionlint zizmor gitleaks
      - run: mise x -- just check
  prepare:
    name: Verify and prepare an immutable database
    needs: [verify]
    runs-on: ubuntu-26.04
    environment: release-candidate
    timeout-minutes: 60
    concurrency:
      group: publication-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Fetches the existing scoped D1 and R2 preparation credentials.
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: $/.github/actions/toolchain
        with:
          tools: node just
      - id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: public-phonebook
          doppler-config: ci_release_candidate
          inject-env-vars: "false"
      - name: Fetch and validate every dataset artifact
        env:
          DATASET_MANIFEST: ${{ inputs.manifest }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node infrastructure/cloudflare/src/remote-data.ts --fetch "$DATASET_MANIFEST" target/dataset
      - run: just data-check target/dataset
      - run: just phone-quality target/dataset target/phone-quality.json
      - name: Prepare the database and public archives without deploying a Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ steps.doppler.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.doppler.outputs.R2_SECRET_ACCESS_KEY }}
        run: node infrastructure/cloudflare/src/remote-data.ts production target/dataset
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-dataset-binding
          path: .local/remote-data/production-dataset.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
