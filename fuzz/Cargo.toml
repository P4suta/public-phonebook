[package]
name = "phonebook-fuzz"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
phonebook-core = { path = "../crates/phonebook-core" }

[[bin]]
name = "core_contracts"
path = "fuzz_targets/core_contracts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reject_false_roundtrip"
path = "fuzz_targets/reject_false_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
