name: PublicPhonebook
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
packages:
  Phonebook:
    path: .
# Swift Build compiles the Swift packages in Debug when a configuration name contains "debug" or "development" in any case.
configs:
  Debug: debug
  DevRelease: release
  VerificationDebug: debug
  VerificationRelease: release
  ProductionDebug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    PHONEBOOK_APP_GROUP: group.$(PHONEBOOK_BUNDLE_ID)
    PHONEBOOK_CALL_DIRECTORY: $(PHONEBOOK_BUNDLE_ID).CallDirectory
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # The QA build's verification screen compiles under this condition, which no other configuration sets.
    VerificationDebug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PHONEBOOK_VERIFICATION_TOOLS
    VerificationRelease:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONEBOOK_VERIFICATION_TOOLS
configFiles:
  Debug: Config/Development.xcconfig
  DevRelease: Config/Development.xcconfig
  VerificationDebug: Config/Verification.xcconfig
  VerificationRelease: Config/Verification.xcconfig
  ProductionDebug: Config/Production.xcconfig
  Release: Config/Production.xcconfig
targetTemplates:
  SharedExtension:
    platform: iOS
    # The Call Directory extension may use only 12 MB, so it links the caller file reader and no database or network code.
    sources:
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Phonebook
        product: PhonebookCore
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
    info:
      properties:
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        PhonebookAppGroup: $(PHONEBOOK_APP_GROUP)
        PhonebookCallDirectory: $(PHONEBOOK_CALL_DIRECTORY)
        PhonebookAPIOrigin: $(PHONEBOOK_API_ORIGIN)
        ITSAppUsesNonExemptEncryption: false
targets:
  PublicPhonebook:
    type: application
    platform: iOS
    sources:
      - App
      - Native
      - path: GeneratedAssets.xcassets
        buildPhase: resources
      # The icon generator rewrites GeneratedAssets.xcassets, so the launch color lives in its own catalog.
      - path: Config/Launch.xcassets
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../design/licenses/Lucide.txt
        buildPhase: resources
    dependencies:
      - package: Phonebook
        product: PhonebookCore
      - package: Phonebook
        product: PhonebookKit
      - target: CallDirectory
        embed: true
    # `ios-check generate` admits each declared archive into target/ios/bundled-dataset, and each configuration copies its own pair.
    postBuildScripts:
      - name: Bundle the declared directory archive
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../target/ios/bundled-dataset/$(PHONEBOOK_BUNDLED_DATASET)/directory.tsv.br
          - $(SRCROOT)/../target/ios/bundled-dataset/$(PHONEBOOK_BUNDLED_DATASET)/directory.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/directory.tsv.br
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/directory.json
        script: |
          set -eu
          cp "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
          cp "$SCRIPT_INPUT_FILE_1" "$SCRIPT_OUTPUT_FILE_1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONEBOOK_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(PHONEBOOK_APP_PROFILE)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
      # The configurations that reach the loopback fixture take the property list with local networking.
      configs:
        Debug:
          INFOPLIST_FILE: Config/App-Info-LocalNetworking.plist
        DevRelease:
          INFOPLIST_FILE: Config/App-Info-LocalNetworking.plist
        VerificationDebug:
          INFOPLIST_FILE: Config/App-Info-LocalNetworking.plist
        ProductionDebug:
          INFOPLIST_FILE: Config/App-Info-LocalNetworking.plist
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: $(PHONEBOOK_DISPLAY_NAME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        PhonebookAppGroup: $(PHONEBOOK_APP_GROUP)
        PhonebookCallDirectory: $(PHONEBOOK_CALL_DIRECTORY)
        PhonebookAPIOrigin: $(PHONEBOOK_API_ORIGIN)
        PhonebookBackgroundRefresh: $(PHONEBOOK_BUNDLE_ID).refresh
        PhonebookBackgroundCheck: $(PHONEBOOK_BUNDLE_ID).check
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [$(PHONEBOOK_BUNDLE_ID).refresh, $(PHONEBOOK_BUNDLE_ID).check]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  CallDirectory:
    type: app-extension
    templates: [SharedExtension]
    sources:
      - CallDirectory
      - Native/VerificationNumberStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONEBOOK_CALL_DIRECTORY)
        PROVISIONING_PROFILE_SPECIFIER: $(PHONEBOOK_CALL_DIRECTORY_PROFILE)
    info:
      path: Config/CallDirectory-Info.plist
      properties:
        CFBundleDisplayName: $(PHONEBOOK_DISPLAY_NAME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
  PhonebookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PublicPhonebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONEBOOK_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
  # `ios-check device-record` runs these tests on a physical iPhone, and no simulator gate builds them.
  PhonebookDeviceMeasurements:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DeviceMeasurements
      # The service's listing, delta listing, and delta that `ios-check device-record` records.
      - path: ../target/ios/device-measurement
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: PublicPhonebook
      - package: Phonebook
        product: PhonebookKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHONEBOOK_BUNDLE_ID).DeviceMeasurements
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PublicPhonebook:
    build:
      targets:
        PublicPhonebook: all
    test:
      config: VerificationDebug
      targets: [PhonebookUITests]
    run:
      config: Debug
    archive:
      config: Release
  PublicPhonebookDevelopment:
    build:
      targets:
        PublicPhonebook: all
    run:
      config: Debug
    archive:
      config: DevRelease
  PublicPhonebookVerification:
    build:
      targets:
        PublicPhonebook: all
    run:
      config: VerificationDebug
    test:
      config: VerificationDebug
      targets: [PhonebookUITests]
    archive:
      config: VerificationRelease
  PublicPhonebookDeviceMeasurements:
    build:
      targets:
        PublicPhonebook: all
    test:
      config: VerificationRelease
      targets: [PhonebookDeviceMeasurements]
