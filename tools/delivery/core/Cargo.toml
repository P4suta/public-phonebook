[package]
name = "delivery-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
