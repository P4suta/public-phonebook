[package]
name = "delivery-fuzz"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
delivery-core = { path = "../core" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "version_identities"
path = "fuzz_targets/version_identities.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
