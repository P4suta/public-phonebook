[workspace]
members = ["core"]
resolver = "3"

[package]
name = "delivery"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.5.51", features = ["derive"] }
delivery-core = { path = "core" }
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
