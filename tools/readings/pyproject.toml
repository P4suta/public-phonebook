[project]
name = "public-phonebook-readings"
version = "0.0.0"
requires-python = "==3.13.16"
dependencies = ["sudachipy==0.7.0"]

[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.3"]
