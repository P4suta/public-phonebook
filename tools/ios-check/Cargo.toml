[workspace]
members = ["step-meter"]

[package]
name = "ios-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
resvg = { version = "=0.49.0", default-features = false }
png = "=0.18.1"
roxmltree = "=0.21.2"
serde = { version = "1", features = ["derive"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
