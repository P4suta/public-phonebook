[workspace]
members = ["crates/phonebook-core", "crates/phonebook", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.sha2]
opt-level = 3
